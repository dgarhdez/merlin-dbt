[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merlin-dbt"
version = "0.1.0"
description = "dbt lineage CLI — outputs Mermaid flowchart diagrams from manifest.json"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["dbt", "lineage", "mermaid", "dag", "cli"]
dependencies = [
    "click>=8.1",
]

[project.scripts]
merlin = "merlin.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/dgarhdez/merlin-dbt"

[tool.hatch.build.targets.wheel]
packages = ["merlin"]
